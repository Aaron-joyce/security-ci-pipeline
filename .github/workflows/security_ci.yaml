name: "Security CI"
on:
  - push
  - pull_request
jobs:
  Secret-Scanning:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Scan Code"
        uses: "gitleaks/gitleaks-action@v3"

  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v7

      - name: "setup UV"
        uses: "astral-sh/setup-uv@v4"

      - name: "setup python"
        run: "uv python install 3.14"

      - name: "Check vulnerabilities"
        run: "uv audit"

      - name: "Run Script / Check"
        env:
         AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
         AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        # Python run with if else as run is expected to fail due to fake credentials
        run: |
            if uv run python src/security_ci_pipeline/main.py; then
              echo "Script completed successfully."
            else
              echo "::Warning:: Script exited with non-zero-status code"
            fi
